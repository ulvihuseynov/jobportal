spring:
  application:
    name: JobPortal

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:job_portal}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}



  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
     enabled: true
     locations: classpath:db/migration
